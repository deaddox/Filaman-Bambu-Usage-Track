<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bambu Lab Plugin</title>
  <style>
    :root {
      --bg: #f2f4ef;
      --panel: #ffffff;
      --ink: #1f2d1f;
      --muted: #5f6e5f;
      --brand: #1f7a4c;
      --brand-soft: #d9efdf;
      --border: #d3dccf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 420px at 8% -8%, #dcebd8 0%, transparent 60%),
        radial-gradient(900px 380px at 92% 0%, #e6f0dc 0%, transparent 58%),
        var(--bg);
      min-height: 100vh;
      padding: 24px;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 24px rgba(25, 40, 25, 0.06);
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.01em;
    }
    p { margin: 0; color: var(--muted); }
    .hero {
      display: grid;
      gap: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 600;
      font-size: 0.86rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .kpi {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fbfdf9;
    }
    .kpi b { font-size: 1.3rem; display: block; }
    .kpi span { color: var(--muted); font-size: 0.85rem; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .btn {
      border: 1px solid var(--brand);
      background: var(--brand);
      color: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .picker {
      display: grid;
      gap: 6px;
      min-width: 280px;
      flex: 1 1 360px;
    }
    .picker label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--ink);
    }
    .picker select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      color: var(--ink);
      background: #fbfdf9;
      font: inherit;
    }
    .hint {
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 1.1em;
    }
    .hint.error {
      color: #a63b3b;
    }
    .mono {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.86rem;
      white-space: pre-wrap;
      background: #0f1811;
      color: #d8f2dd;
      border-radius: 10px;
      padding: 12px;
      min-height: 180px;
      overflow: auto;
    }
    @media (max-width: 780px) {
      body { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card hero">
      <span class="badge">Bambu Lab Plugin Page</span>
      <h1>Readonly AMS Overview</h1>
      <p>This page is intentionally readonly-safe. It surfaces plugin health and slot data while assignment writes remain disabled.</p>
    </section>

    <section class="card">
      <div class="toolbar">
        <div class="picker">
          <label for="printer-select">Printer Context</label>
          <select id="printer-select" aria-label="Select printer context">
            <option value="">Loading printers...</option>
          </select>
          <div id="printer-hint" class="hint"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="grid">
        <article class="kpi"><b id="kpi-running">-</b><span>Driver Running</span></article>
        <article class="kpi"><b id="kpi-connected">-</b><span>MQTT Connected</span></article>
        <article class="kpi"><b id="kpi-slots">-</b><span>Total Slots</span></article>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <strong>Live Snapshot</strong>
        <button id="refresh" class="btn" type="button">Refresh</button>
      </div>
      <div id="out" class="mono" role="status">Waiting for refresh...</div>
    </section>
  </main>

  <script>
    const out = document.getElementById("out");
    const refreshBtn = document.getElementById("refresh");
    const running = document.getElementById("kpi-running");
    const connected = document.getElementById("kpi-connected");
    const slots = document.getElementById("kpi-slots");
    const printerSelect = document.getElementById("printer-select");
    const printerHint = document.getElementById("printer-hint");
    const SELECTED_PRINTER_STORAGE_KEY = "bambu_plugin_selected_printer_id";

    function getPrinterIdFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("printer_id") || params.get("id");
      if (!id) return null;
      const parsed = Number(id);
      return Number.isFinite(parsed) ? parsed : null;
    }

    function asBool(value) {
      if (typeof value === "boolean") return value;
      if (typeof value === "number") return value !== 0;
      if (typeof value === "string") {
        const normalized = value.trim().toLowerCase();
        if (["true", "yes", "on", "1", "running", "active", "connected", "online"].includes(normalized)) {
          return true;
        }
        if (["false", "no", "off", "0", "stopped", "inactive", "disconnected", "offline"].includes(normalized)) {
          return false;
        }
      }
      return null;
    }

    function asNumber(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : null;
    }

    function walkObjects(root, visit) {
      const seen = new Set();
      const stack = [root];
      while (stack.length > 0) {
        const node = stack.pop();
        if (!node || typeof node !== "object") {
          continue;
        }
        if (seen.has(node)) {
          continue;
        }
        seen.add(node);
        visit(node);
        for (const value of Object.values(node)) {
          if (value && typeof value === "object") {
            stack.push(value);
          }
        }
      }
    }

    function findFirstBoolByKeys(root, keys) {
      let found = null;
      walkObjects(root, (node) => {
        if (found != null) return;
        for (const key of keys) {
          if (!(key in node)) continue;
          const value = asBool(node[key]);
          if (value != null) {
            found = value;
            return;
          }
        }
      });
      return found;
    }

    function deriveSlotCount(data) {
      const direct = asNumber(
        data?.slot_count ?? data?.slots_count ?? data?.total_slots ?? data?.slotCount,
      );
      if (direct != null) {
        return direct;
      }

      if (Array.isArray(data?.slots)) {
        return data.slots.length;
      }

      if (Array.isArray(data?.ams_units)) {
        const unitsCount = data.ams_units.reduce((sum, unit) => {
          const trayCount = asNumber(unit?.tray_count ?? unit?.slot_count ?? unit?.count) ?? 0;
          return sum + trayCount;
        }, 0);
        if (unitsCount > 0) {
          return unitsCount;
        }
      }

      return 0;
    }

    function normalizeHealthPayload(payload) {
      const raw = payload?.health
        || payload?.driver_health
        || payload?.status?.health
        || payload?.driver?.health
        || payload?.printer?.health
        || payload;
      const data = (raw && typeof raw === "object") ? raw : {};

      const directRunning = asBool(
        data?.running
        ?? data?.is_running
        ?? data?.active
        ?? data?.driver_running
        ?? data?.status,
      );
      const nestedRunning = findFirstBoolByKeys(data, [
        "running",
        "is_running",
        "driver_running",
        "active",
        "enabled",
      ]);

      const directConnected = asBool(
        data?.connected
        ?? data?.is_connected
        ?? data?.mqtt_connected
        ?? data?.connected_raw
        ?? data?.online
        ?? data?.connection_status,
      );
      const nestedConnected = findFirstBoolByKeys(data, [
        "connected",
        "is_connected",
        "mqtt_connected",
        "connected_raw",
        "online",
      ]);

      const running = directRunning ?? nestedRunning ?? false;
      const connected = directConnected ?? nestedConnected ?? false;

      return {
        ...data,
        running,
        connected,
        slot_count: deriveSlotCount(data),
      };
    }

    function normalizePrintersPayload(payload) {
      const source = Array.isArray(payload)
        ? payload
        : payload?.printers || payload?.items || payload?.data || [];

      if (!Array.isArray(source)) {
        return [];
      }

      const byId = new Map();
      for (const raw of source) {
        const parsedId = Number(raw?.id ?? raw?.printer_id ?? raw?.printerId);
        if (!Number.isFinite(parsedId)) {
          continue;
        }
        if (byId.has(parsedId)) {
          continue;
        }
        const name = raw?.name || raw?.display_name || raw?.hostname || `Printer ${parsedId}`;
        byId.set(parsedId, { id: parsedId, name: String(name) });
      }

      return Array.from(byId.values()).sort((a, b) => a.id - b.id);
    }

    function getStoredPrinterId() {
      const raw = window.localStorage.getItem(SELECTED_PRINTER_STORAGE_KEY);
      if (!raw) return null;
      const parsed = Number(raw);
      return Number.isFinite(parsed) ? parsed : null;
    }

    function setStoredPrinterId(printerId) {
      if (Number.isFinite(printerId)) {
        window.localStorage.setItem(SELECTED_PRINTER_STORAGE_KEY, String(printerId));
      }
    }

    function setPrinterHint(message, isError) {
      printerHint.textContent = message || "";
      printerHint.classList.toggle("error", Boolean(isError));
    }

    function getEffectivePrinterId() {
      const selected = Number(printerSelect.value);
      if (Number.isFinite(selected)) {
        return selected;
      }
      return getPrinterIdFromQuery() ?? getStoredPrinterId();
    }

    function applyPrinterSelectionOptions(printers, preferredId) {
      printerSelect.innerHTML = "";

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Select printer";
      printerSelect.appendChild(placeholder);

      for (const printer of printers) {
        const option = document.createElement("option");
        option.value = String(printer.id);
        option.textContent = `${printer.name} (${printer.id})`;
        printerSelect.appendChild(option);
      }

      const hasPreferred = preferredId != null && printers.some((p) => p.id === preferredId);
      if (hasPreferred) {
        printerSelect.value = String(preferredId);
      } else if (printers.length > 0) {
        printerSelect.value = String(printers[0].id);
      } else {
        printerSelect.value = "";
      }

      printerSelect.disabled = printers.length === 0;
    }

    async function fetchPrinters() {
      const endpoints = [
        "/api/v1/printers",
        "/api/printers",
      ];

      let lastError = null;
      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint, { credentials: "include" });
          if (!res.ok) {
            lastError = new Error(`${endpoint} -> HTTP ${res.status}`);
            continue;
          }
          const json = await res.json();
          const printers = normalizePrintersPayload(json);
          return { endpoint, printers };
        } catch (error) {
          lastError = new Error(`${endpoint} -> ${error}`);
        }
      }

      throw lastError || new Error("No compatible printer list endpoint found");
    }

    async function initializePrinterContext() {
      const queryPrinterId = getPrinterIdFromQuery();
      const storedPrinterId = getStoredPrinterId();
      const preferredPrinterId = queryPrinterId ?? storedPrinterId;

      try {
        const { endpoint, printers } = await fetchPrinters();
        applyPrinterSelectionOptions(printers, preferredPrinterId);

        const effective = getEffectivePrinterId();
        if (effective != null) {
          setStoredPrinterId(effective);
        }

        if (queryPrinterId != null) {
          setPrinterHint(`Using printer from URL (source list: ${endpoint})`, false);
        } else if (effective != null) {
          setPrinterHint(`Using saved/default printer (source list: ${endpoint})`, false);
        } else {
          setPrinterHint(`No printers available from ${endpoint}`, true);
        }
      } catch (error) {
        if (preferredPrinterId != null) {
          applyPrinterSelectionOptions(
            [{ id: preferredPrinterId, name: `Printer ${preferredPrinterId}` }],
            preferredPrinterId,
          );
          setPrinterHint(`Using fallback context (${error})`, true);
        } else {
          applyPrinterSelectionOptions([], null);
          setPrinterHint(`Unable to load printers (${error})`, true);
        }
      }
    }

    function updateUrlPrinterId(printerId) {
      if (!Number.isFinite(printerId)) {
        return;
      }
      const url = new URL(window.location.href);
      url.searchParams.set("printer_id", String(printerId));
      window.history.replaceState({}, "", url.toString());
    }

    async function fetchHealthSnapshot(printerId) {
      const endpoints = [
        `/api/v1/printers/${printerId}/health`,
        `/api/v1/printers/${printerId}/status`,
        `/api/v1/printers/${printerId}`,
      ];

      let lastError = null;

      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint, { credentials: "include" });
          if (!res.ok) {
            lastError = new Error(`${endpoint} -> HTTP ${res.status}`);
            continue;
          }

          const json = await res.json();
          return { endpoint, health: normalizeHealthPayload(json) };
        } catch (error) {
          lastError = new Error(`${endpoint} -> ${error}`);
        }
      }

      throw lastError || new Error("No compatible printer health endpoint found");
    }

    async function loadSnapshot() {
      refreshBtn.disabled = true;
      const printerId = getEffectivePrinterId();
      if (printerId == null) {
        out.textContent = "No printer selected. Choose a printer context to load health data.";
        refreshBtn.disabled = false;
        return;
      }

      setStoredPrinterId(printerId);
      updateUrlPrinterId(printerId);

      try {
        const { endpoint, health } = await fetchHealthSnapshot(printerId);

        running.textContent = health?.running ? "Yes" : "No";
        connected.textContent = health?.connected ? "Yes" : "No";
        slots.textContent = String(health?.slot_count ?? 0);

        out.textContent = `Source: ${endpoint}\n\n${JSON.stringify(health, null, 2)}`;
      } catch (error) {
        out.textContent = `Failed to load health snapshot: ${error}`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    printerSelect.addEventListener("change", loadSnapshot);
    refreshBtn.addEventListener("click", loadSnapshot);
    initializePrinterContext().then(loadSnapshot);
  </script>
</body>
</html>
